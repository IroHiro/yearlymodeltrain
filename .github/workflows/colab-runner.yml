# .github/workflows/colab-runner.yml
name: Yearly Colab Notebook Runner

on:
  schedule:
    - cron: '0 0 15 1 *'  # January 15th at 00:00 UTC
  workflow_dispatch:

jobs:
  run-colab:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager
          sudo apt-get update
          sudo apt-get install -y chromium-browser
      
      - name: Run Colab Notebook Automation
        run: python run_colab.py
        env:
          PYTHONUNBUFFERED: 1
      
      - name: Upload debug screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colab-debug-screenshots
          path: |
            debug_*.png
          retention-days: 7
